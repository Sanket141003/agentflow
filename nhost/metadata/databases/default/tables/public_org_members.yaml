table:
  name: org_members
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
select_permissions:
  - role: user
    permission:
      columns: [id, org_id, user_id, role, created_at]
      filter:
        org_id:
          _in:
            # only see members of orgs the caller belongs to
            _select:
              table:
                name: org_members
                schema: public
              column: org_id
              where:
                user_id:
                  _eq: X-Hasura-User-Id
insert_permissions:
  - role: user
    permission:
      columns: [org_id, user_id, role]
      check:
        _and:
          - org_id:
              _in:
                _select:
                  table:
                    name: org_members
                    schema: public
                  column: org_id
                  where:
                    _and:
                      - user_id:
                          _eq: X-Hasura-User-Id
                      - role:
                          _eq: owner
delete_permissions:
  - role: user
    permission:
      filter:
        org_id:
          _in:
            _select:
              table:
                name: org_members
                schema: public
              column: org_id
              where:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - role:
                      _eq: owner
