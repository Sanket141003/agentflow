table:
  name: step_runs
  schema: public
object_relationships:
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
  - name: workflow_step
    using:
      foreign_key_constraint_on: workflow_step_id
select_permissions:
  - role: user
    permission:
      columns: [id, workflow_run_id, workflow_step_id, step_order, status, input_data, output_data, error, attempt_count, approved_by, approved_at, started_at, completed_at, created_at, updated_at]
      filter:
        workflow_run:
          org_id:
            _in:
              _select:
                table:
                  name: org_members
                  schema: public
                column: org_id
                where:
                  user_id:
                    _eq: X-Hasura-User-Id
