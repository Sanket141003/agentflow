table:
  name: workflow_steps
  schema: public
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
array_relationships:
  - name: step_runs
    using:
      foreign_key_constraint_on:
        column: workflow_step_id
        table:
          name: step_runs
          schema: public
select_permissions:
  - role: user
    permission:
      columns: [id, workflow_id, step_order, name, step_type, config, created_at, updated_at]
      filter:
        workflow:
          org_id:
            _in:
              _select:
                table:
                  name: org_members
                  schema: public
                column: org_id
                where:
                  user_id:
                    _eq: X-Hasura-User-Id
insert_permissions:
  - role: user
    permission:
      columns: [workflow_id, step_order, name, step_type, config]
      check:
        workflow:
          org_id:
            _in:
              _select:
                table:
                  name: org_members
                  schema: public
                column: org_id
                where:
                  _and:
                    - user_id:
                        _eq: X-Hasura-User-Id
                    - role:
                        _in: [owner, editor]
update_permissions:
  - role: user
    permission:
      columns: [step_order, name, step_type, config]
      filter:
        workflow:
          org_id:
            _in:
              _select:
                table:
                  name: org_members
                  schema: public
                column: org_id
                where:
                  _and:
                    - user_id:
                        _eq: X-Hasura-User-Id
                    - role:
                        _in: [owner, editor]
delete_permissions:
  - role: user
    permission:
      filter:
        workflow:
          org_id:
            _in:
              _select:
                table:
                  name: org_members
                  schema: public
                column: org_id
                where:
                  _and:
                    - user_id:
                        _eq: X-Hasura-User-Id
                    - role:
                        _in: [owner, editor]
